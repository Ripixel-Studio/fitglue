components:
    schemas:
        ActivityEnrichments:
            type: object
            properties:
                heartRate:
                    $ref: '#/components/schemas/HeartRateSummary'
                heartRateZones:
                    $ref: '#/components/schemas/HeartRateZonesSummary'
                effort:
                    $ref: '#/components/schemas/EffortScoreSummary'
                calories:
                    $ref: '#/components/schemas/CaloriesSummary'
                trainingLoad:
                    $ref: '#/components/schemas/TrainingLoadSummary'
                recovery:
                    $ref: '#/components/schemas/RecoverySummary'
                streak:
                    $ref: '#/components/schemas/StreakSummary'
                aiSummary:
                    $ref: '#/components/schemas/AiSummary'
                aiBanner:
                    $ref: '#/components/schemas/AiBanner'
                pace:
                    $ref: '#/components/schemas/PaceSummary'
                cadence:
                    $ref: '#/components/schemas/CadenceSummary'
                power:
                    $ref: '#/components/schemas/PowerSummary'
                elevation:
                    $ref: '#/components/schemas/ElevationSummary'
                speed:
                    $ref: '#/components/schemas/SpeedSummary'
                parkrun:
                    $ref: '#/components/schemas/ParkrunSummary'
                weather:
                    $ref: '#/components/schemas/WeatherSummary'
                location:
                    $ref: '#/components/schemas/LocationSummary'
                runningDynamics:
                    $ref: '#/components/schemas/RunningDynamicsSummary'
                personalRecords:
                    $ref: '#/components/schemas/PersonalRecordsSummary'
                distanceMilestone:
                    $ref: '#/components/schemas/DistanceMilestoneSummary'
                goalTracker:
                    $ref: '#/components/schemas/GoalTrackerSummary'
                spotify:
                    $ref: '#/components/schemas/SpotifyTracksSummary'
                intervals:
                    $ref: '#/components/schemas/IntervalsSummary'
                muscleHeatmap:
                    $ref: '#/components/schemas/MuscleHeatmapSummary'
                temperature:
                    $ref: '#/components/schemas/TemperatureSummary'
                bestEfforts:
                    $ref: '#/components/schemas/BestEffortsSummary'
                hdrop:
                    $ref: '#/components/schemas/HDropSummary'
            description: |-
                ActivityEnrichments holds typed outputs from the enricher pipeline.
                 Each sub-message is optional — only present if the corresponding enricher
                 was configured and ran. Replaces enrichment_metadata map<string,string>.
        AiBanner:
            type: object
            properties:
                imageUrl:
                    type: string
                promptHash:
                    type: string
                generatorVersion:
                    type: string
        AiSummary:
            type: object
            properties:
                html:
                    type: string
                model:
                    type: string
                generatedAt:
                    type: string
                    format: date-time
        AppleHealthIntegration:
            type: object
            properties:
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
        BackfillActivitiesGatewayRequest:
            type: object
            properties:
                id:
                    type: string
                source:
                    type: string
                sourceActivityIds:
                    type: array
                    items:
                        type: string
        BackfillActivitiesGatewayResponse:
            type: object
            properties:
                queuedCount:
                    type: integer
                    format: int32
        BackfillConnectionActivitiesGatewayRequest:
            type: object
            properties:
                provider:
                    type: string
                sourceActivityIds:
                    type: array
                    items:
                        type: string
        BestEffort:
            type: object
            properties:
                distanceKey:
                    type: string
                display:
                    type: string
                distanceM:
                    type: number
                    format: double
                timeSeconds:
                    type: number
                    format: double
        BestEffortsSummary:
            type: object
            properties:
                efforts:
                    type: array
                    items:
                        $ref: '#/components/schemas/BestEffort'
        BoosterExecution:
            type: object
            properties:
                providerName:
                    type: string
                durationMs:
                    type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                error:
                    type: string
                status:
                    enum:
                        - EXECUTION_STEP_STATUS_UNSPECIFIED
                        - EXECUTION_STEP_STATUS_QUEUED
                        - EXECUTION_STEP_STATUS_RUNNING
                        - EXECUTION_STEP_STATUS_OK
                        - EXECUTION_STEP_STATUS_PASS
                        - EXECUTION_STEP_STATUS_SKIPPED
                        - EXECUTION_STEP_STATUS_FAILED
                        - EXECUTION_STEP_STATUS_RETRIED
                    type: string
                    format: enum
        CadenceSummary:
            type: object
            properties:
                avgRpm:
                    type: integer
                    format: int32
                maxRpm:
                    type: integer
                    format: int32
        CaloriesSummary:
            type: object
            properties:
                kcal:
                    type: integer
                    format: int32
                comparisonText:
                    type: string
        CancelPipelineGatewayRequest:
            type: object
            properties:
                inputId:
                    type: string
        CancelPipelineRunGatewayRequest:
            type: object
            properties:
                runId:
                    type: string
        ConnectionActionGatewayRequest:
            type: object
            properties:
                provider:
                    type: string
                action:
                    type: string
        Counter:
            type: object
            properties:
                id:
                    type: string
                count:
                    type: string
                lastUpdated:
                    type: string
                    format: date-time
        CreatePipelineGatewayRequest:
            type: object
            properties:
                pipeline:
                    $ref: '#/components/schemas/PipelineConfig'
        CreateShowcaseGatewayRequest:
            type: object
            properties:
                showcase:
                    $ref: '#/components/schemas/ShowcasedActivity'
        DestinationConfig:
            type: object
            properties:
                config:
                    type: object
                    additionalProperties:
                        type: string
                excludedEnrichers:
                    type: array
                    items:
                        type: string
        DestinationOutcome:
            type: object
            properties:
                destination:
                    enum:
                        - DESTINATION_UNSPECIFIED
                        - DESTINATION_STRAVA
                        - DESTINATION_SHOWCASE
                        - DESTINATION_HEVY
                        - DESTINATION_TRAININGPEAKS
                        - DESTINATION_INTERVALS
                        - DESTINATION_GOOGLESHEETS
                        - DESTINATION_GITHUB
                        - DESTINATION_MOCK
                    type: string
                    format: enum
                status:
                    enum:
                        - DESTINATION_STATUS_UNSPECIFIED
                        - DESTINATION_STATUS_PENDING
                        - DESTINATION_STATUS_SUCCESS
                        - DESTINATION_STATUS_FAILED
                        - DESTINATION_STATUS_SKIPPED
                    type: string
                    format: enum
                externalId:
                    type: string
                error:
                    type: string
                completedAt:
                    type: string
                    format: date-time
        DistanceMilestoneSummary:
            type: object
            properties:
                milestoneKm:
                    type: number
                    format: double
                lifetimeDistanceKm:
                    type: number
                    format: double
                nextMilestoneKm:
                    type: number
                    format: double
                activityTypeLabel:
                    type: string
        EffortFactor:
            type: object
            properties:
                label:
                    type: string
                ratioVsBaseline:
                    type: number
                    format: double
        EffortScoreSummary:
            type: object
            properties:
                score:
                    type: integer
                    format: int32
                band:
                    type: string
                factors:
                    type: array
                    items:
                        $ref: '#/components/schemas/EffortFactor'
        ElevationSummary:
            type: object
            properties:
                totalGainM:
                    type: number
                    format: double
                totalLossM:
                    type: number
                    format: double
                maxAltitudeM:
                    type: number
                    format: double
        EnricherConfig:
            type: object
            properties:
                providerType:
                    enum:
                        - ENRICHER_PROVIDER_UNSPECIFIED
                        - ENRICHER_PROVIDER_FITBIT_HEART_RATE
                        - ENRICHER_PROVIDER_WORKOUT_SUMMARY
