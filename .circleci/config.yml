version: 2.1

orbs:
  terraform: circleci/terraform@3.2.0


executors:
  unified-executor:
    docker:
      - image: cimg/go:1.25.5-node

jobs:
  build-and-test:
    executor: unified-executor
    steps:
      - checkout
      - run:
          name: Install Core Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y rsync
      - restore_cache:
          keys:
            - go-mod-v2-{{ checksum "src/go/go.sum" }}
      - run:
          name: Setup Environment
          command: make setup
      - save_cache:
          key: go-mod-v2-{{ checksum "src/go/go.sum" }}
          paths:
            - ~/go/pkg/mod
      # Proto linting, code generation, and drift checks are enforced
      # locally via `make preflight` (pre-push git hook).
      - run:
          name: Build
          command: make build
      - run:
          name: Linting
          command: make lint
      - run:
          name: Run Tests
          command: make test
      - store_artifacts:
          path: docs/api/openapi.yaml
          destination: openapi-spec
      - persist_to_workspace:
          root: .
          paths:
            # Only ship what the deploy job needs — not node_modules, coverage, etc.
            - Dockerfile
            - src/go
            - src/typescript
            - terraform
            - Makefile

  deploy:
    parameters:
      target:
        type: string
      project_number:
        type: string
    executor:
      name: terraform/default
      tag: "1.5.7"
    # Docker builds run on the remote-docker VM, not this container — the
    # primary container only runs terraform/gcloud, so xlarge (40 credits/min)
    # was paying 4x for idle CPU. Runs twice (dev+prod) per main commit.
    resource_class: medium
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install dependencies
          command: |
            apk add --no-cache python3 py3-pip curl bash make nodejs npm go docker-cli
      - run:
          name: Authenticate with GCP via OIDC
          command: |
            PROJECT_ID="fitglue-server-<< parameters.target >>"
            PROJECT_NUMBER="<< parameters.project_number >>"

            # Download and install gcloud SDK
            curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
            tar -xf google-cloud-cli-linux-x86_64.tar.gz
            ./google-cloud-sdk/install.sh --quiet
            export PATH=$PATH:$(pwd)/google-cloud-sdk/bin

            # Store OIDC token
            echo $CIRCLE_OIDC_TOKEN > /tmp/oidc_token.txt

            # Create credential config
            gcloud iam workload-identity-pools create-cred-config \
              "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/circleci-pool/providers/circleci-provider" \
              --service-account=circleci-deployer@${PROJECT_ID}.iam.gserviceaccount.com \
              --output-file=/tmp/gcp_cred_config.json \
              --credential-source-file=/tmp/oidc_token.txt

            # Authenticate
            gcloud auth login --brief --cred-file=/tmp/gcp_cred_config.json

            # Set credentials for terraform
            echo "export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_cred_config.json" >> $BASH_ENV
            echo "export PATH=\$PATH:$(pwd)/google-cloud-sdk/bin" >> $BASH_ENV
      # No prepare step needed — Docker builds from source directly
      - run:
          name: Terraform Init
          command: |
             export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_cred_config.json
             terraform -chdir=terraform init -backend-config=envs/<< parameters.target >>.backend.tfvars
      - run:
          name: Create Artifact Registry (targeted apply)
          command: |
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_cred_config.json
            export PATH=$PATH:$(pwd)/google-cloud-sdk/bin
            terraform -chdir=terraform apply -auto-approve -lock-timeout=20m \
              -target=google_artifact_registry_repository.services \
              -var-file="envs/<< parameters.target >>.tfvars"
      - run:
          name: Build and Push Docker Images
          command: |
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_cred_config.json
            export PATH=$PATH:$(pwd)/google-cloud-sdk/bin
            gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

            # Pushes to Artifact Registry occasionally hit a transient 5xx
            # (e.g. "received unexpected HTTP status: 502 Bad Gateway"), which
            # fails the whole deploy and reds the main branch even though the
            # build itself is fine. Retry registry pushes with backoff so a
            # single registry hiccup doesn't require a manual rerun.
            retry() {
              local n=1 max=5 delay=10
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "✗ giving up after ${max} attempts: $*" >&2
                  return 1
                fi
                echo "⚠ attempt ${n}/${max} failed: $* — retrying in ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
              done
            }

            TAG="${CIRCLE_SHA1:0:12}"
            REGISTRY="us-central1-docker.pkg.dev/fitglue-server-<< parameters.target >>/fitglue-services"
            SERVICES="api-client api-public api-webhook user billing pipeline activity registry destination notification"

            for svc in $SERVICES; do
              IMAGE="$REGISTRY/$svc:$TAG"

              # Compute a content hash of everything that affects this service.
              # Any change to shared code (pkg/, internal/, go.mod, go.sum, Dockerfile)
              # or the service itself will produce a new hash and force a rebuild.
              SVC_HASH=$(find src/go/services/$svc src/go/pkg src/go/internal \
                src/go/go.mod src/go/go.sum Dockerfile \
                -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null \
                | sha256sum | cut -c1-12)
              CACHE_IMAGE="$REGISTRY/$svc:cache-$SVC_HASH"

              if docker pull "$CACHE_IMAGE" 2>/dev/null; then
                echo "✓ $svc unchanged (cache-$SVC_HASH) — skipping build"
                docker tag "$CACHE_IMAGE" "$IMAGE"
                retry docker push "$IMAGE"
                continue
              fi

              # Build with a minimal per-service context: only this service +
              # the shared code it depends on. No other services are sent.
              echo "→ Building $svc (cache-$SVC_HASH)..."
              CTX=$(mktemp -d)
              mkdir -p "$CTX/src/go/services"
              cp Dockerfile "$CTX/"
              cp src/go/go.mod src/go/go.sum "$CTX/src/go/"
              cp -r src/go/pkg src/go/internal "$CTX/src/go/"
              cp -r "src/go/services/$svc" "$CTX/src/go/services/"

              docker build -t "$IMAGE" --build-arg SERVICE_NAME=$svc "$CTX"
              rm -rf "$CTX"

              retry docker push "$IMAGE"
              # Tag with content hash so the next run can skip if nothing changed
              docker tag "$IMAGE" "$CACHE_IMAGE"
              retry docker push "$CACHE_IMAGE"
            done

            # Build parkrun-fetcher (TypeScript/Playwright — separate Dockerfile)
            FETCHER_IMAGE="$REGISTRY/parkrun-fetcher:$TAG"
            FETCHER_HASH=$(find src/typescript/parkrun-fetcher -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
            FETCHER_CACHE_IMAGE="$REGISTRY/parkrun-fetcher:cache-$FETCHER_HASH"
            if docker pull "$FETCHER_CACHE_IMAGE" 2>/dev/null; then
              echo "✓ parkrun-fetcher unchanged (cache-$FETCHER_HASH) — skipping build"
              docker tag "$FETCHER_CACHE_IMAGE" "$FETCHER_IMAGE"
              retry docker push "$FETCHER_IMAGE"
            else
              echo "→ Building parkrun-fetcher (cache-$FETCHER_HASH)..."
              docker build -t "$FETCHER_IMAGE" src/typescript/parkrun-fetcher
              retry docker push "$FETCHER_IMAGE"
              docker tag "$FETCHER_IMAGE" "$FETCHER_CACHE_IMAGE"
              retry docker push "$FETCHER_CACHE_IMAGE"
            fi
      - run:
          name: Deploy Infrastructure (Terraform)
          command: |
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_cred_config.json
            export PATH=$PATH:$(pwd)/google-cloud-sdk/bin
            TAG="${CIRCLE_SHA1:0:12}"
            terraform -chdir=terraform apply -auto-approve -lock-timeout=20m \
              -var-file="envs/<< parameters.target >>.tfvars" \
              -var "image_tag=$TAG"

  # upload-sourcemaps job removed — no longer applicable to Go-only server

  create-release:
    executor: unified-executor
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:VRiS+EY45HNsLzWN3a7lKsalrTzaBb4gRiQoc1IK0X4"
      - run:
          name: Setup Git User
          command: |
            git config --global user.email "ci@fitglue.tech"
            git config --global user.name "CircleCI Bot"
      - restore_cache:
          keys:
            - npm-root-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: npm ci
      - save_cache:
          key: npm-root-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules
      - run:
          name: Run Standard Version
          command: |
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -q "\[skip release\]"; then
              echo "Skipping release due to [skip release] in commit message"
              exit 0
            fi

            # Check if main has moved on since this pipeline started
            git fetch origin main
            LOCAL_HEAD=$(git rev-parse HEAD)
            REMOTE_HEAD=$(git rev-parse origin/main)
            if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
              echo "NOTICE: main branch has newer commits since this pipeline started."
              echo "Skipping release - the newer commits will go through their own pipeline."
              echo "Pipeline will continue without creating a release."
              exit 0
            fi

            npm run release
            git push --follow-tags origin main
      - run:
          name: Update Central Version in GCS
          command: |
            VERSION=$(node -p "require('./package.json').version")
            echo '{"version":"'$VERSION'","lastBumpBy":"server","lastUpdated":"'$(date -Iseconds)'","serverCommit":"'$CIRCLE_SHA1'"}' > /tmp/version.json

            # Install gcloud
            curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
            tar -xf google-cloud-cli-linux-x86_64.tar.gz
            ./google-cloud-sdk/install.sh --quiet
            export PATH=$PATH:$(pwd)/google-cloud-sdk/bin

            # Auth with OIDC (prod project)
            echo $CIRCLE_OIDC_TOKEN > /tmp/oidc_token.txt
            gcloud iam workload-identity-pools create-cred-config \
              "projects/605889586984/locations/global/workloadIdentityPools/circleci-pool/providers/circleci-provider" \
              --service-account=circleci-deployer@fitglue-server-prod.iam.gserviceaccount.com \
              --output-file=/tmp/gcp_cred_config.json \
              --credential-source-file=/tmp/oidc_token.txt
            gcloud auth login --brief --cred-file=/tmp/gcp_cred_config.json

            # Upload version.json
            gcloud storage cp /tmp/version.json gs://fitglue-server-prod-version-config/version.json
            echo "Updated central version to $VERSION"
      - run:
          name: Trigger Web Rebuild
          command: |
            VERSION=$(node -p "require('./package.json').version")
            # Trigger web rebuild - web will fetch server version from GCS
            curl -X POST "https://circleci.com/api/v2/project/github/Ripixel-Studio/fitglue-web/pipeline" \
              -H "Circle-Token: ${CIRCLECI_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "branch": "main",
                "parameters": {
                  "triggered_by_server": true
                }
              }'
            echo "Triggered web rebuild (server version $VERSION now in GCS)"

workflows:
  version: 2
  pipeline:
    jobs:
      - build-and-test
      - deploy:
          name: deploy-prod
          target: prod
          project_number: "605889586984"
          requires:
            - build-and-test
          filters:
            branches:
              only: main
      - create-release:
          requires:
            - deploy-prod
