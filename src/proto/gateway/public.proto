syntax = "proto3";

package fitglue.gateway;

import "google/api/annotations.proto";

import "models/activity/uploaded.proto";
import "models/activity/roundup.proto";

option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/gateway";

// PublicGatewayService describes the unauthenticated REST API surface
// served by api-public at /api/public/*.
//
// No authentication required. Used by public showcase profile pages.
service PublicGatewayService {

  // ===================== Public Showcase =====================
  rpc GetPublicShowcase(GetPublicShowcaseRequest) returns (fitglue.models.activity.ShowcasedActivity) {
    option (google.api.http) = {
      get: "/showcase/{id}"
    };
  }
  rpc GetPublicShowcaseProfile(GetPublicShowcaseProfileRequest) returns (GetPublicShowcaseProfileResponse) {
    option (google.api.http) = {
      get: "/showcase/profile/{slug}"
    };
  }

  rpc GetPublicRoundup(GetPublicRoundupGatewayRequest) returns (fitglue.models.activity.ShowcaseRoundup) {
    option (google.api.http) = {
      get: "/showcase/{slug}/roundup/{period_key}"
    };
  }
  rpc GetRecentPublicRoundups(GetRecentPublicRoundupsGatewayRequest) returns (GetRecentPublicRoundupsGatewayResponse) {
    option (google.api.http) = {
      get: "/showcase/{slug}/roundups/recent"
    };
  }
}

// =====================================================================
// Request/Response messages
// =====================================================================

message PublicEmptyRequest {}

// Showcase
message GetPublicShowcaseRequest {
  string id = 1;
}
message GetPublicShowcaseProfileRequest {
  string slug = 1;
  int32 page = 2; // optional query param
}
message GetPublicShowcaseProfileResponse {
  fitglue.models.activity.ShowcaseProfile profile = 1;
  repeated fitglue.models.activity.ShowcasedActivity showcases = 2;
  int32 total_pages = 3;
  int32 current_page = 4;
}

message GetPublicRoundupGatewayRequest {
  string slug = 1;
  string period_key = 2;
}
message GetRecentPublicRoundupsGatewayRequest {
  string slug = 1;
  int32 page = 2; // optional query param — 1-indexed, defaults to 1
}
message GetRecentPublicRoundupsGatewayResponse {
  repeated fitglue.models.activity.ShowcaseRoundup roundups = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
}
