  string input_id = 1;
}
message CancelPipelineRunGatewayRequest {
  string run_id = 1;
}
message RepostActivityGatewayRequest {
  string id = 1; // activity_id from path
}

// UpdateActivityGatewayRequest is the web PATCH body for editing an activity. Only the
// fields named in update_mask are applied to the user-edit overlay; the rest are left
// unchanged. Mirrors ActivityUserEditOverlay's editable fields.
message UpdateActivityGatewayRequest {
  string id = 1; // activity_id from path
  string name = 2;
  string description = 3;
  fitglue.models.activity.ActivityType type = 4;
  repeated string tags = 5;
  // Editable overlay fields to apply: "name" | "description" | "type" | "tags".
  repeated string update_mask = 6;
}

// Individual enricher invocation (propose → accept/dismiss)
message InvokeEnricherGatewayRequest {
  string id = 1;            // activity_id from path
  string provider_name = 2; // enricher provider registry name from path
}
message InvokeEnricherGatewayResponse {
  fitglue.models.activity.EnricherRunLayer proposed = 1;
  fitglue.models.activity.StandardizedActivity preview = 2;
  bool proposed_created = 3;
}
message ProposedEnricherRunGatewayRequest {
  string id = 1;           // activity_id from path
  string execution_id = 2; // proposed enricher-run layer id from path
}

// Activities
message ListActivitiesGatewayRequest {
  int32 limit = 1;
  string page_token = 2;
}
message ListActivitiesGatewayResponse {
  repeated fitglue.models.activity.StandardizedActivity activities = 1;
  string next_page_token = 2;
}
message ListResolvedActivitiesGatewayRequest {
  int32 limit = 1;
  string page_token = 2;
}
message ListResolvedActivitiesGatewayResponse {
  repeated fitglue.models.activity.ResolvedActivity activities = 1;
  string next_page_token = 2;
}
message GetActivityStatsGatewayResponse {
  int32 total_activities = 1;
  int32 total_showcases = 2;
  string last_activity_at = 3;
  int32 uploads_this_month = 5;   // Total destination posts this month (one per destination per activity)
  int32 activities_this_month = 6; // Distinct activities successfully synced this month
  int32 activities_this_week = 7;  // Distinct activities successfully synced this week
  int32 current_streak_days = 8;
  int32 longest_streak_days = 9;
  int32 uploads_this_week = 10;   // Total destination posts this week (one per destination per activity)
}

