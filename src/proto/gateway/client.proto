// Pipeline run payload (signed-URL access)
enum PayloadKind {
  PAYLOAD_KIND_UNSPECIFIED = 0;
  PAYLOAD_KIND_ORIGINAL = 1;
  PAYLOAD_KIND_ENRICHED = 2;
}

message GetPipelineRunPayloadGatewayRequest {
  string run_id = 1;
  PayloadKind which = 2;
}

message GetPipelineRunPayloadGatewayResponse {
  string download_url = 1;              // short-lived signed GCS URL
  int64 size_bytes = 2;
  string content_type = 3;             // "application/json"
  google.protobuf.Timestamp expires_at = 4;
}

