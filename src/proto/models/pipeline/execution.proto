syntax = "proto3";

package fitglue.models.pipeline;

import "google/protobuf/timestamp.proto";
import "models/activity/source.proto";
import "models/plugin/provider.proto";

option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/models/pipeline";

message PipelineRun {
  string id = 1;
  string pipeline_id = 2;
  string activity_id = 3;

  string source = 4;
  string source_activity_id = 5;

  string title = 6;
  string description = 7;
  fitglue.models.activity.ActivityType type = 8;
  google.protobuf.Timestamp start_time = 9;

  PipelineRunStatus status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;

  repeated BoosterExecution boosters = 13;
  repeated DestinationOutcome destinations = 14;

  optional string status_message = 15;
  optional string pending_input_id = 16;

  string original_payload_uri = 22;
  string enriched_event_uri = 23;

  // GCS URI of the durable, layered ActivityRecord written on pipeline completion
  // (fitglue.models.activity.ActivityRecord as protojson). Empty for legacy runs
  // created before layered storage, which fall back to enriched_event_uri.
  string activity_record_uri = 27;

  // When the raw provider payload at original_payload_uri is pruned (ingest + 30d,
  // spec DECISION 1a). Informational; deletion is enforced by a GCS lifecycle rule
  // on the payloads/ prefix. After this, reprocessing relies on a re-pull.
  google.protobuf.Timestamp raw_payload_expires_at = 28;

  // IDs of non-blocking PendingInputs still awaiting user input for this run.
  // Cleared as each one is resolved; when empty the status transitions to SYNCED.
  repeated string non_blocking_pending_input_ids = 25;

  // Unified record of every step in a pipeline run — source, parse, gate,
  // enricher batch, router, and per-destination uploaders.
  // boosters[] is preserved for existing documents; new clients should prefer steps[].
  repeated ExecutionStep steps = 24;

  // 26 was user_id, populated only by the deleted admin cross-user listing.
  reserved 26;
  reserved "user_id";
}

enum PipelineRunStatus {
  PIPELINE_RUN_STATUS_UNSPECIFIED = 0;
  PIPELINE_RUN_STATUS_RUNNING = 1;      
  PIPELINE_RUN_STATUS_SYNCED = 2;       
  PIPELINE_RUN_STATUS_PARTIAL = 3;      
  PIPELINE_RUN_STATUS_FAILED = 4;       
  PIPELINE_RUN_STATUS_PENDING = 5;      
  PIPELINE_RUN_STATUS_SKIPPED = 6;      
  PIPELINE_RUN_STATUS_ARCHIVED = 7;     
  PIPELINE_RUN_STATUS_TIER_BLOCKED = 8;
  PIPELINE_RUN_STATUS_CANCELLED = 9;
  // Destinations were called successfully, but one or more non-blocking enrichers
  // are still awaiting user input. Destinations will be updated when they resolve.
  PIPELINE_RUN_STATUS_SYNCED_WITH_PENDING = 10;
}

// ExecutionStep is the unified record for a single step in a pipeline run.
message ExecutionStep {
  string id = 1;                          // stable per-step ID for deep-linking
  int32 ordinal = 2;                      // 1-indexed display order
  ExecutionStepKind kind = 3;
  string display_name = 4;               // "File Upload", "Parse FIT", "Strava Upload"
  string service = 5;                    // e.g. "webhook · strava"
  ExecutionStepStatus status = 6;
  int64 offset_ms = 7;                   // ms from run start
  int64 duration_ms = 8;
  optional string status_label = 9;      // override pill text, e.g. "✓ 25/25"
  optional string error = 10;
  map<string, string> metadata = 11;
}

enum ExecutionStepKind {
  EXECUTION_STEP_KIND_UNSPECIFIED = 0;
  EXECUTION_STEP_KIND_SOURCE = 1;         // webhook ingestion
  EXECUTION_STEP_KIND_PARSE = 2;          // FIT parse
  EXECUTION_STEP_KIND_GATE = 3;           // condition matcher / activity filter
  EXECUTION_STEP_KIND_ENRICHER_BATCH = 4; // the enricher chain as one step
  EXECUTION_STEP_KIND_ROUTER = 5;
  EXECUTION_STEP_KIND_DESTINATION = 6;
}

enum ExecutionStepStatus {
  EXECUTION_STEP_STATUS_UNSPECIFIED = 0;
  EXECUTION_STEP_STATUS_QUEUED = 1;
  EXECUTION_STEP_STATUS_RUNNING = 2;
  EXECUTION_STEP_STATUS_OK = 3;
  EXECUTION_STEP_STATUS_PASS = 4;     // gate passed
  EXECUTION_STEP_STATUS_SKIPPED = 5;
  EXECUTION_STEP_STATUS_FAILED = 6;
  EXECUTION_STEP_STATUS_RETRIED = 7;  // re-run via Repost*
}

message BoosterExecution {
  string provider_name = 1;
  reserved 2;  // was: string status (freeform). Replaced by typed ExecutionStepStatus.
  int64 duration_ms = 3;
  map<string, string> metadata = 4;
  optional string error = 5;
  ExecutionStepStatus status = 6;
}

message DestinationOutcome {
  fitglue.models.plugin.DestinationType destination = 1;
  DestinationStatus status = 2;
  optional string external_id = 3;       
  optional string error = 4;
  google.protobuf.Timestamp completed_at = 5;
}

enum DestinationStatus {
  DESTINATION_STATUS_UNSPECIFIED = 0;
  DESTINATION_STATUS_PENDING = 1;
  DESTINATION_STATUS_SUCCESS = 2;
  DESTINATION_STATUS_FAILED = 3;
  DESTINATION_STATUS_SKIPPED = 4;        
}

message ExecutionRecord {
  string execution_id = 1;  
  string service = 2;        
  ExecutionStatus status = 3; 
  google.protobuf.Timestamp timestamp = 4; 
  string trigger_type = 7;   

  optional string user_id = 5;
  optional string test_run_id = 6;  

  optional google.protobuf.Timestamp start_time = 8;
  optional google.protobuf.Timestamp end_time = 9;

  optional string error_message = 10;
  optional string inputs_json = 11;   
  optional string outputs_json = 12;  
  optional google.protobuf.Timestamp expire_at = 14; 

  optional string pipeline_execution_id = 15;  
}

enum ExecutionStatus {
  STATUS_UNSPECIFIED = 0;
  STATUS_STARTED = 1;
  STATUS_SUCCESS = 2;
  STATUS_FAILED = 3;
  STATUS_PENDING = 4;
  STATUS_WAITING = 5;
  STATUS_LAGGED_RETRY = 6;
  STATUS_SKIPPED = 7;  
}
