syntax = "proto3";

package fitglue.models.user;

import "google/protobuf/timestamp.proto";
import "models/activity/source.proto";


option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/models/user";

// UserProfile represents the core user identity and preferences,
// cleanly separated from integrations.
message UserProfile {
  // 4, 6, 7, 8 and 11 were tier, sync_count_this_month, sync_count_reset_at,
  // prevented_sync_count and trial_ends_at — removed with billing.
  reserved 4, 6, 7, 8, 11;
  reserved "tier", "sync_count_this_month", "sync_count_reset_at", "prevented_sync_count", "trial_ends_at";

  string user_id = 1;
  google.protobuf.Timestamp created_at = 2;
  reserved 3; // was the push-token list (removed, single-user conversion F1.3)

  bool is_admin = 5;
  
  // Waitlist gate - false until admin enables access
  bool access_enabled = 9;
  
  reserved 10; // was push notification preferences (removed, single-user conversion F1.3)

  string email = 12;
  string display_name = 13;

  // Streak aggregates — written by streak-tracker enricher rollup on every activity sync.
  // A "streak day" is any calendar day with at least one qualifying activity.
  // Optional; absent means not yet computed.
  optional int32 current_streak_days = 14;
  optional int32 longest_streak_days = 15;
}

message Counter {
  string id = 1; // Key, e.g. "parkrun_bushy"
  int64 count = 2;
  google.protobuf.Timestamp last_updated = 3;
}

// Personal Record for tracking PRs across cardio and strength activities
message PersonalRecord {
  string record_type = 1;  // e.g. "fastest_5k", "bench_press_1rm"
  double value = 2;        // The record value 
  string unit = 3;         // "seconds", "kg", "meters", "reps"
  string activity_id = 4;  // Activity where this PR was achieved
  google.protobuf.Timestamp achieved_at = 5;
  fitglue.models.activity.ActivityType activity_type = 6;
  optional double previous_value = 7;  // Previous PR value
  optional double improvement = 8;     // Percentage improvement
}
