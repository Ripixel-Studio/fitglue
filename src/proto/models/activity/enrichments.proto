syntax = "proto3";

package fitglue.models.activity;

import "google/protobuf/timestamp.proto";
import "models/activity/source.proto";

option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/models/activity";

// ActivityEnrichments holds typed outputs from the enricher pipeline.
// Each sub-message is optional — only present if the corresponding enricher
// was configured and ran. Replaces enrichment_metadata map<string,string>.
message ActivityEnrichments {
  reserved 9;
  reserved "ai_banner";
  optional HeartRateSummary heart_rate = 1;
  optional HeartRateZonesSummary heart_rate_zones = 2;
  optional EffortScoreSummary effort = 3;
  optional CaloriesSummary calories = 4;
  optional TrainingLoadSummary training_load = 5;
  optional RecoverySummary recovery = 6;
  optional StreakSummary streak = 7;
  optional AiSummary ai_summary = 8;
  optional PaceSummary pace = 10;
  optional CadenceSummary cadence = 11;
  optional PowerSummary power = 12;
  optional ElevationSummary elevation = 13;
  optional SpeedSummary speed = 14;
  optional ParkrunSummary parkrun = 15;
  optional WeatherSummary weather = 16;
  optional LocationSummary location = 17;
  optional RunningDynamicsSummary running_dynamics = 18;
  optional PersonalRecordsSummary personal_records = 19;
  optional DistanceMilestoneSummary distance_milestone = 20;
  optional GoalTrackerSummary goal_tracker = 21;
  optional SpotifyTracksSummary spotify = 22;
  optional IntervalsSummary intervals = 23;
  optional MuscleHeatmapSummary muscle_heatmap = 24;
  optional TemperatureSummary temperature = 25;
  optional BestEffortsSummary best_efforts = 26;
  optional HDropSummary hdrop = 27;
  optional ActivityClassification classification = 28;
}

// ActivityClassification is the ai-activity-type enricher's verdict (or its
// deterministic fallback): the personal site's own tag, whether the activity was
// "the actual thing" (an entered race or event, a real parkrun effort), and the
// Strava type it was given. race_why is for debugging and never exported.
message ActivityClassification {
  string tag = 1;                                // run|ride|spin|hyrox|class|strength|pilates|yoga|walk|other
  bool is_race = 2;
  string race_why = 3;                           // one line, debugging only
  ActivityType strava_type = 4;                  // the type sent to Strava
  string model = 5;                              // "claude-haiku" or "rule"
  string inputs_hash = 6;                        // hash of the prompt inputs; a repost with the same hash reuses this
  google.protobuf.Timestamp classified_at = 7;
}

message HeartRateSummary {
  int32 min_bpm = 1;
  int32 avg_bpm = 2;
  int32 max_bpm = 3;
  int32 drift_bpm = 4;     // positive means HR drifted up over the session
  bool drift_warning = 5;  // true if drift exceeds the enricher's configured threshold
}

message HeartRateZonesSummary {
  repeated HeartRateZoneBucket zones = 1;
  int32 total_minutes = 2;
}

message HeartRateZoneBucket {
  int32 zone_index = 1;   // 0–5
  string name = 2;        // "Zone 0 (Rest)", "Zone 1 (Recovery)", …
  int32 minutes = 3;
  double percentage = 4;
}

message EffortScoreSummary {
  int32 score = 1;               // 0–100 relative to user's rolling history
  string band = 2;               // "Easy", "Moderate", "Hard", "Very Hard"
  repeated EffortFactor factors = 3;
}

message EffortFactor {
  string label = 1;             // "HR", "Pace", "Duration", "Elevation", "Intensity"
  double ratio_vs_baseline = 2; // e.g. 0.75, 1.21
}

message CaloriesSummary {
  int32 kcal = 1;
  string comparison_text = 2;  // e.g. "≈ 1.0 slice of pizza"
}

message TrainingLoadSummary {
  int32 trimp = 1;
  string bucket = 2;  // "Recovery", "Easy", "Moderate", "Hard", "Very Hard"
  string hint = 3;    // short contextual copy
}

message RecoverySummary {
  int32 session_load = 1;          // TRIMP for this session
  double acute_chronic_ratio = 2;  // ACWR
  int32 hours_to_recover = 3;
  bool alert = 4;                  // true if ACWR is in the danger band (> 1.3)
  string alert_text = 5;           // e.g. "ACWR 1.42 — load is climbing fast"
  int32 seven_day_load = 6;        // total TRIMP over last 7 days (including today)
  int32 twenty_eight_day_avg_load = 7; // average daily TRIMP over last 28 days
}

message StreakSummary {
  int32 current_days = 1;
  int32 longest_days = 2;
  repeated StreakDay calendar = 3;  // most-recent-last; covers last N days
}

message StreakDay {
  string date = 1;         // YYYY-MM-DD
  StreakDayState state = 2;
}

enum StreakDayState {
  STREAK_DAY_STATE_UNSPECIFIED = 0;
  STREAK_DAY_STATE_OFF = 1;     // no qualifying activity
  STREAK_DAY_STATE_ACTIVE = 2;  // active training day
  STREAK_DAY_STATE_REST = 3;    // scheduled rest; counts toward streak
}

message AiSummary {
  string html = 1;                              // sanitised HTML — may contain <b> and <span>
  string model = 2;                             // e.g. "claude-sonnet"
  google.protobuf.Timestamp generated_at = 3;
}

message PaceSummary {
  double avg_pace_seconds_per_km = 1;
  double best_split_seconds_per_km = 2;
  repeated PaceSplit splits = 3;
  double pace_drop_percent = 4;  // % slowdown from first quarter to last quarter; 0 if not enough splits
}

message PaceSplit {
  int32 km = 1;
  double seconds = 2;
}

message CadenceSummary {
  int32 avg_rpm = 1;
  int32 max_rpm = 2;
}

message PowerSummary {
  int32 avg_watts = 1;
  int32 normalized_power = 2;  // NP
  double intensity_factor = 3; // IF — only set when FTP is configured
  int32 kilojoules = 4;
  int32 max_watts = 5;
}

message ElevationSummary {
  double total_gain_m = 1;
  double total_loss_m = 2;
  double max_altitude_m = 3;
}

message SpeedSummary {
  double avg_speed_kmh = 1;
  double max_speed_kmh = 2;
}

message WeatherSummary {
  double temp_c = 1;
  string weather_description = 2;  // "Clear", "Rain", "Partly Cloudy", etc.
  double wind_speed_kph = 3;
  string wind_direction = 4;       // "N", "NE", "SW", etc.
  int32 weather_code = 5;          // WMO weather code
}

message LocationSummary {
  string location_name = 1;  // e.g. "Bushy Park, London"
  string country = 2;
  double latitude = 3;
  double longitude = 4;
}

message RunningDynamicsSummary {
  double avg_ground_contact_ms = 1;
  double avg_vertical_oscillation_cm = 2;
  double avg_step_length_m = 3;
}

message ParkrunSummary {
  string event_name = 1;    // e.g. "Bushy parkrun"
  int32 position = 2;
  string finish_time = 3;   // e.g. "19:42"
  string age_grade = 4;     // e.g. "76.2%"
  int32 total_parkruns = 5; // all-time run count
  bool is_time_pb = 6;
  bool is_age_grade_pb = 7;
}

message PersonalRecord {
  string record_type = 1;           // e.g. "5k", "bench_press_1rm"
  double new_value = 2;
  string unit = 3;                  // "seconds", "kg"
  optional double previous_value = 4;
  optional double improvement = 5;  // percentage
  string display_message = 6;       // formatted human-readable summary
}

message PersonalRecordsSummary {
  repeated PersonalRecord records = 1;
}

message DistanceMilestoneSummary {
  double milestone_km = 1;
  double lifetime_distance_km = 2;
  optional double next_milestone_km = 3;
  string activity_type_label = 4;  // e.g. "running"
}

message GoalEntry {
  string label = 1;        // e.g. "Run · 2,500 km"
  double current = 2;      // accumulated progress this period
  double target = 3;
  string unit = 4;         // "km", "hours", "activities"
  bool on_pace = 5;
  int32 days_remaining = 6;
}

message GoalTrackerSummary {
  repeated GoalEntry goals = 1;
}

message SpotifyTrack {
  string title = 1;
  string artist = 2;
  int32 duration_seconds = 3;
}

message SpotifyTracksSummary {
  repeated SpotifyTrack tracks = 1;
  int32 total_count = 2;
}

message IntervalSegment {
  string type = 1;              // "warmup", "active", "recovery", "cooldown"
  string label = 2;             // e.g. "Interval 1", "Recovery 2"
  double duration_seconds = 3;
  double distance_meters = 4;
  double avg_hr = 5;
  double avg_speed_ms = 6;      // m/s — derive pace/speed from activity category
}

message IntervalsSummary {
  repeated IntervalSegment segments = 1;
  string workout_name = 2;      // e.g. "4×400m" if structured workout
}

message TemperatureSummary {
  int32 min_c = 1;
  int32 avg_c = 2;
  int32 max_c = 3;
}

message MuscleHeatmapSummary {
  repeated string primary = 1;    // e.g. ["chest", "triceps"]
  repeated string secondary = 2;  // e.g. ["shoulders"]
  string image_url = 3;           // populated by MUSCLE_HEATMAP_IMAGE if it ran
}

message BestEffort {
  string distance_key = 1;   // e.g. "5k", "half_marathon", "1_mile"
  string display = 2;        // e.g. "5K", "Half Marathon", "1 Mile"
  double distance_m = 3;
  double time_seconds = 4;
}

message BestEffortsSummary {
  repeated BestEffort efforts = 1;
}

message HDropTimeseriesPoint {
  double time_minutes = 1;
  double sweat_rate = 2;             // L/hr
  double fluid_loss_cumulative = 3;  // L, cumulative
  double sodium_concentration = 4;   // mg/L
  double temperature = 5;            // °C skin temperature
}

message HDropSummary {
  double total_fluid_loss_l = 1;
  double sweat_rate_l_per_hr = 2;
  double total_sodium_mg = 3;
  double total_potassium_mg = 4;
  double sodium_concentration_mg_per_l = 5;
  double avg_hdrop_score = 6;
  double min_hdrop_score = 7;
  string body_location = 8;
  double min_temperature_c = 9;
  double max_temperature_c = 10;
  repeated HDropTimeseriesPoint timeseries = 11;
}
