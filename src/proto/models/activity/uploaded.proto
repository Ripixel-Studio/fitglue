syntax = "proto3";

package fitglue.models.activity;

import "google/protobuf/timestamp.proto";
import "models/activity/source.proto";
import "models/plugin/provider.proto";
import "models/activity/standardized.proto";
import "models/activity/enrichments.proto";

option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/models/activity";

message UploadedActivityRecord {
  string id = 1;
  string user_id = 2;

  ActivitySource source = 3;           
  string external_id = 4;              
  google.protobuf.Timestamp start_time = 5;  

  fitglue.models.plugin.DestinationType destination = 6;  
  string destination_id = 7;           

  google.protobuf.Timestamp uploaded_at = 8;
}

// ShowcasedActivity represents a publicly shareable activity snapshot.
message ShowcasedActivity {
  string showcase_id = 1;
  string activity_id = 2;
  reserved 3;
  reserved "user_id";

  string title = 4;
  string description = 5;
  ActivityType activity_type = 6;
  ActivitySource source = 7;
  google.protobuf.Timestamp start_time = 8;

  fitglue.models.activity.StandardizedActivity activity_data = 9;
  string fit_file_uri = 10;            

  repeated string applied_enrichments = 11;
  reserved 12;  // was: map<string,string> enrichment_metadata. Replaced by typed ActivityEnrichments.
  repeated string tags = 13;
  optional string pipeline_execution_id = 14;

  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp expires_at = 16;  

  string owner_display_name = 17;  
  string activity_data_uri = 18;
  string owner_profile_picture_url = 19;
  string owner_profile_slug = 20;
  repeated string photo_urls = 21;
  ActivityEnrichments enrichments = 22;
}

message ShowcaseProfileEntry {
  string showcase_id = 1;
  string title = 2;
  ActivityType activity_type = 3;
  ActivitySource source = 4;
  google.protobuf.Timestamp start_time = 5;
  string route_thumbnail_url = 6;
  double distance_meters = 7;
  double duration_seconds = 8;

  int32 total_sets = 9;
  int32 total_reps = 10;
  double total_weight_kg = 11;

  // Reskin additions — populated on each activity sync
  int32 booster_count = 12;
  int32 destination_count = 13;
  optional EntrySparkline sparkline = 14;
  optional int32 avg_heart_rate = 15;
  optional int32 calories_kcal = 16;

  // PR tag displayed on profile activity cards (e.g. "★ DEADLIFT 180KG · +5KG")
  optional string pr_label = 17;

  // HR zone minutes per bucket (index 0–4), used to aggregate LifetimeZoneSplit on the profile.
  // Populated at entry creation time from the HR zones enrichment; absent means no zone data.
  repeated int32 hr_zone_minutes = 18;

  // Photo URLs for activities with attached images; populated from ShowcasedActivity.photo_urls.
  repeated string photo_urls = 19;

  google.protobuf.Timestamp created_at = 20;

  // Enrichment summaries projected at entry creation time (from the hydrated
  // ActivityEnrichments) so roundups can aggregate them without re-reading GCS.
  // All optional; absent means the source enrichment did not run for this activity.
  optional double elevation_gain_m = 21;
  optional string location_name = 22;       // e.g. "Bushy Park, London"
  optional string country = 23;
  optional double temp_c = 24;
  optional string weather_description = 25;  // "Clear", "Rain", etc.
  repeated BestEffort best_efforts = 26;     // reuse enrichments.BestEffort
  repeated string primary_muscles = 27;      // primary muscles worked (strength)
}

// EntrySparkline is a downsampled timeseries for card-level sparklines.
message EntrySparkline {
  string metric = 1;           // "heart_rate" | "pace" | "power" | "weight"
  repeated double values = 2;  // ≤ 24 sample points, downsampled
}

message ShowcaseTheme {
  string theme_id = 1;
  string custom_accent_color = 2;
  string animation_id = 3;
  string card_style = 4;
}

message ShowcaseLink {
  string label = 1;
  string url = 2;
}

message ShowcaseBioCallout {
  string text = 1;
}

message ShowcaseProfile {
  string slug = 1;                            
  string user_id = 2;                         
  string display_name = 3;                    
  repeated ShowcaseProfileEntry entries = 4;  

  int32 total_activities = 5;
  double total_distance_meters = 6;
  double total_duration_seconds = 7;
  google.protobuf.Timestamp latest_activity_at = 8;

  int32 total_sets = 11;
  int32 total_reps = 12;
  double total_weight_kg = 13;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  string subtitle = 14;             
  string bio = 15;                  
  string profile_picture_url = 16;  
  bool visible = 17;                

  ShowcaseTheme theme = 18;         

  bool default_destination = 19;    // Auto-add Showcase destination when creating new pipelines
  bool show_photo_gallery = 20;
  repeated ShowcaseLink links = 21;
  repeated ShowcaseBioCallout callouts = 22;

  // Lifetime aggregates — written by a daily rollup job. Optional; absent means not yet computed.
  optional LifetimeZoneSplit zone_split = 23;
  optional WeeklyStreakHistory streak_history = 24;

  // Top strength PRs — populated at request time from users/{userId}/personal_records/
  repeated ShowcaseTopPR top_prs = 25;

  optional RoundupSettings roundup_settings = 26;
}

// RoundupSettings controls auto-generation of showcase roundup pages.
// Athlete-tier only; all fields default to false.
message RoundupSettings {
  bool enabled_weekly = 1;
  bool enabled_monthly = 2;
  bool enabled_yearly = 3;
}

// ShowcaseTopPR is a lightweight personal record for display on the profile medal wall.
message ShowcaseTopPR {
  string record_type = 1;                         // e.g. "bench_press_1rm"
  double value = 2;                               // e.g. 180
  string unit = 3;                                // "kg", "seconds", "meters"
  optional google.protobuf.Timestamp achieved_at = 4;
  optional double previous_value = 5;             // for computing improvement delta
}

message LifetimeZoneSplit {
  repeated HeartRateZoneBucket zones = 1;   // re-uses HeartRateZoneBucket from enrichments.proto
  google.protobuf.Timestamp computed_at = 2;
  string label = 3;                         // "Polarized", "Pyramidal", "Threshold"
}

message WeeklyStreakHistory {
  int32 weeks_tracked = 1;        // e.g. 26
  int32 missed_weeks = 2;         // count of weeks with zero qualifying activities
  repeated bool weekly_active = 3; // most-recent-last; true = had at least one activity
}
