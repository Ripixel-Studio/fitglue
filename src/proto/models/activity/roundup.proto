syntax = "proto3";
package fitglue.models.activity;
import "google/protobuf/timestamp.proto";
import "models/activity/source.proto";
import "models/activity/uploaded.proto";
import "models/activity/enrichments.proto";
option go_package = "github.com/fitglue/server/src/go/pkg/types/pb/models/activity";
enum RoundupPeriodType {
  ROUNDUP_PERIOD_TYPE_UNSPECIFIED = 0;
  ROUNDUP_PERIOD_TYPE_WEEK = 1;
  ROUNDUP_PERIOD_TYPE_MONTH = 2;
  ROUNDUP_PERIOD_TYPE_YEAR = 3;
}
// Per-day effort record for the consistency calendar heatmap.
message RoundupDayEntry {
  string date = 1;          // YYYY-MM-DD (UTC)
  int32 effort_level = 2;   // 0=rest 1=easy 2=moderate 3=hard 4=peak
  int32 activity_count = 3;
}
// Pre-computed spotlight card — biggest session, longest streak, peak PR day.
message ShowcaseCalloutActivity {
  string kind = 1;          // e.g. "BIGGEST SESSION"
  string title = 2;
  string stat_value = 3;    // pre-formatted primary stat, e.g. "5:42"
  string stat_unit = 4;     // unit/sub-stat line, e.g. "H:MM · 142 KM"
  string sub = 5;           // second detail line
  string date = 6;          // e.g. "14 Sep"
  ActivityType activity_type = 7;
  string showcase_id = 8;   // source showcase activity, if this callout maps to one
}
// A photo surfaced in the roundup photo mosaic.
message RoundupPhoto {
  string url = 1;
  string activity_title = 2;
  string date = 3;          // e.g. "14 Sep"
  ActivityType activity_type = 4;
  string showcase_id = 5;   // source showcase activity, for click-through
}
// A GPS route thumbnail surfaced in the roundup route wall.
message RoundupRoute {
  string thumbnail_url = 1;
  string activity_title = 2;
  string date = 3;          // e.g. "14 Sep"
  double distance_meters = 4;
  ActivityType activity_type = 5;
  string showcase_id = 6;   // source showcase activity, for click-through
}
// A place trained at during the period (from LocationSummary).
message RoundupPlace {
  string name = 1;
  string country = 2;
  int32 activity_count = 3;
}
// Aggregate weather grit over the period (from WeatherSummary).
message RoundupWeather {
  int32 session_count = 1;   // sessions that carried weather data
  int32 rain_count = 2;      // sessions in rain/drizzle/snow
  double coldest_temp_c = 3;
  double hottest_temp_c = 4;
}
// A muscle group worked across the period, with frequency (from MuscleHeatmapSummary).
message RoundupMuscle {
  string name = 1;
  int32 count = 2;
}
message RoundupActivityTypeBreakdown {
  ActivityType activity_type = 1;
  int32 activity_count = 2;
  double total_distance_meters = 3;
  double total_duration_seconds = 4;
  double total_weight_kg = 5;
  int32 total_sets = 6;
  int32 total_reps = 7;
}
message ShowcaseRoundup {
  string roundup_id = 1;
  string slug = 2;
  string user_id = 3;
  RoundupPeriodType period_type = 4;
  string period_key = 5;
  google.protobuf.Timestamp period_start = 6;
  google.protobuf.Timestamp period_end = 7;
  google.protobuf.Timestamp generated_at = 8;
  int32 total_activities = 9;
  double total_duration_seconds = 10;
  double total_distance_meters = 11;
  double total_elevation_gain_meters = 12;
  int32 total_calories_kcal = 13;
  repeated RoundupActivityTypeBreakdown activity_type_breakdowns = 14;
  repeated int32 hr_zone_minutes = 15;
  repeated ShowcaseTopPR prs_achieved = 16;
  repeated ActivitySource sources = 17;
  int32 effort_easy_count = 18;
  int32 effort_moderate_count = 19;
  int32 effort_hard_count = 20;
  string owner_display_name = 21;
  string owner_profile_picture_url = 22;
  string owner_profile_slug = 23;
  // Highlight stats — best single activity across the period
  double longest_activity_duration_seconds = 24;
  double highest_single_lift_kg = 25;
  double highest_calories_per_hour_kcal = 26;
  string highest_avg_bpm_activity_title = 27;
  int32 highest_avg_bpm = 28;
  // AI-generated narrative summary of the period, empty if unavailable
  string ai_summary = 29;
  // Pre-computed spotlight callouts (biggest session, longest streak, peak PR day)
  repeated ShowcaseCalloutActivity callout_activities = 30;
  // Per-day effort entries for the consistency calendar heatmap
  repeated RoundupDayEntry day_entries = 31;
  // Photos collected from the period's activities (gated by show_photo_gallery)
  repeated RoundupPhoto photos = 32;
  // GPS route thumbnails collected from the period's activities
  repeated RoundupRoute routes = 33;
  // Enrichment aggregates (elevation feeds total_elevation_gain_meters above)
  repeated RoundupPlace places = 34;
  optional RoundupWeather weather = 35;
  repeated BestEffort best_efforts = 36;   // fastest per distance across the period
  repeated RoundupMuscle muscles = 37;
  // More single-session peaks for the "ceiling raised" highlights band
  double furthest_activity_meters = 38;     // longest single distance
  int32 most_calories_single_kcal = 39;     // most calories burned in one session
  double biggest_session_volume_kg = 40;    // heaviest single strength session (reps × weight)
  // Source showcase activity for each single-session peak, for click-through.
  string longest_session_showcase_id = 41;
  string highest_burn_rate_showcase_id = 42;
  string highest_avg_bpm_showcase_id = 43;
  string furthest_showcase_id = 44;
  string most_calories_showcase_id = 45;
  string biggest_volume_showcase_id = 46;
  // Who wrote ai_summary and when: "claude-sonnet" for the Claude path in his
  // voice (pkg/voice); empty on summaries written before this was recorded
  // (the old Gemini third-person ones). fitgluectl regen-roundup-stories skips
  // roundups already carrying the current value.
  string ai_summary_model = 47;
  google.protobuf.Timestamp ai_summary_generated_at = 48;
}
